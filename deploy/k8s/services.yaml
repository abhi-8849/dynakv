# Headless Service: no virtual IP. It gives every StatefulSet pod a stable DNS name such as dynakv-a-0.dynakv, which the gossip
# seeds use. It is also the "serviceName" the StatefulSets below refer to.
apiVersion: v1
kind: Service
metadata:
  # Pod DNS names end in .dynakv, so this name is part of the -join addresses.
  name: dynakv
spec:
  # "None" makes the Service headless.
  clusterIP: None
  # Publish pod addresses before the pods are ready: a node must be able to resolve its seeds while it is still starting.
  publishNotReadyAddresses: true
  # Select every dynakv pod from all three zone StatefulSets.
  selector:
    app: dynakv
  ports:
    # Port where nodes expose the gRPC API.
    - name: grpc
      port: 7000
    # Port where nodes gossip with each other.
    - name: gossip
      port: 7946
---
# ClusterIP Service: one stable address for clients inside the cluster. Any node can answer any request, so spreading connections
# across pods is correct.
apiVersion: v1
kind: Service
metadata:
  name: dynakv-client
spec:
  # Reachable only from inside the cluster.
  type: ClusterIP
  # Send traffic to every dynakv pod.
  selector:
    app: dynakv
  ports:
    # Clients connect to dynakv-client:7000.
    - name: grpc
      port: 7000
      targetPort: grpc
